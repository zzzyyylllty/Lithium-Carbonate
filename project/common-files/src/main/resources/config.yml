# lithiumcarbon Configuration / lithiumcarbon 配置
debug: false

hook:
  worldguard: true
  # sertraline: true - Deprecated / 已弃用

file-load:
  loots: "^(?![#!]).*\\.(?i)(yaml|yml|toml|tml|json|conf)$"

lang: en_US

default-options:
  add-lore: null
  remove-lore: false
  shuffle-loot: false
  private: false

# Weight system / 权重系统
# Higher weight defines replace lower weight ones when overlapping. Equal weights mix together.
# / 权重大的区域会替换掉权重小的区域的箱子刷新，权重相等混合刷新。
# Must add "weight: <number>" to each define in loot config files / 需在战利品配置文件的 define 中添加 "weight: <数字>"
weight-system: false

# Ignore warnings and errors / 忽略警告和错误
logger:
  ignore-errors:
    ErrorNoAvailableSlots: false
    ErrorNoPools: false
    ErrorItemGenerationFailed: false
    ErrorItemGenerationFailedNull: false
  ignore-warnings:
    WarningNotSupportDataComponent: false

# Allowed loot blocks / 允许的战利品方块
# Not support regex - if you want to support all blocks using allowed-all-blocks / 不支持正则表达式 - 如需允许所有方块请使用 allowed-all-blocks
# If you want to allow external blocks / 如需允许外部方块
# Please use real-block in server side, ex BROWN_MUSHROOM_BLOCK / 请使用服务端真实方块ID，例如 BROWN_MUSHROOM_BLOCK
allowed-blocks:
  - CHEST
  - GRAY_SHULKER_BOX

# Bypass allowed-blocks check / 绕过允许方块检查
allowed-all-blocks: false

# Allowed loot worlds / 允许的战利品世界
# Supported regex / 支持正则表达式
allowed-worlds:
  - "world.+"

# Bypass allowed-worlds check / 绕过允许世界检查
allowed-all-worlds: true

default-layout:
  - '         '
  - '         '
  - '         '

message:
  SearchLimit: true
  SearchStart: true
  Searching: false
  Searched: false
  Claim: false
  ClaimExp: true

sounds:
  open: "minecraft:block.chest.locked 1 0.6 block"
  search: "minecraft:item.armor.equip_chain 1 1 block"
  searching: "minecraft:block.stone_pressure_plate.click_on 1 0.5 block"
  search-end: "minecraft:block.dispenser.dispense 1 1 block"
  search-limit: "minecraft:entity.villager.no 1 1 block"
  claim: "minecraft:block.stone_pressure_plate.click_on 1 1 block"
